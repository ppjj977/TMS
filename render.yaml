# Render Blueprint — provisions the TMS web service + PostgreSQL database.
# Deploy via: Render Dashboard → New → Blueprint → pick this repo.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: tms
    runtime: node
    plan: free
    region: frankfurt # change to your nearest region (e.g. oregon, ohio, singapore)
    # Build also generates the Prisma client and applies DB migrations. The
    # DATABASE_URL below is available at build time because the DB is linked.
    buildCommand: npm install && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tms-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true # Render generates a secure random value
      - key: NODE_VERSION
        value: "22.16.0"
      # --- Optional: real email. Leave unset to use the logged fallback. ---
      # - key: SMTP_HOST
      #   sync: false
      # - key: SMTP_PORT
      #   sync: false
      # - key: SMTP_USER
      #   sync: false
      # - key: SMTP_PASS
      #   sync: false
      # - key: SMTP_FROM
      #   sync: false

databases:
  - name: tms-db
    plan: free
    databaseName: tms
    user: tms
    region: frankfurt # must match the web service region
