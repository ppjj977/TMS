services:
  db:
    image: postgres:16
    container_name: tms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tms
      POSTGRES_PASSWORD: tms
      POSTGRES_DB: tms
    ports:
      - "5432:5432"
    volumes:
      - tms-pgdata:/var/lib/postgresql/data

volumes:
  tms-pgdata:
